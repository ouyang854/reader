<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>静态文献阅读器</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <aside class="library">
      <header class="library-head">
        <div>
          <h1>文献库</h1>
          <p id="paperCount">本地浏览器存储</p>
        </div>
        <button id="importBtn">导入</button>
      </header>
      <input id="importInput" type="file" accept=".pdf,.md,.txt" multiple hidden />
      <input id="translationInput" type="file" accept=".md,.txt" hidden />
      <input id="searchInput" class="search" placeholder="搜索文件名" />
      <div class="filters" id="filterBar">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="unread">未读</button>
        <button class="filter-btn" data-filter="read">已读</button>
        <button class="filter-btn" data-filter="translated">有译文</button>
        <button class="filter-btn" data-filter="missing">无译文</button>
      </div>
      <div id="paperList" class="paper-list"></div>
    </aside>

    <div class="splitter" data-resize="library" title="拖动调整文献库宽度"></div>

    <main class="desk">
      <header class="topbar">
        <div class="title-block">
          <span id="statusPill" class="pill">未选择</span>
          <h2 id="activeTitle">导入 PDF 后开始阅读</h2>
          <p id="activeMeta">这个版本不需要运行 Python 服务。</p>
        </div>
        <div class="toolbar">
          <button id="toggleReadBtn" disabled>标为已读</button>
          <button id="attachTranslationBtn" disabled>导入译文</button>
          <button id="exportBtn">导出备份</button>
          <button id="importBackupBtn">导入备份</button>
          <input id="backupInput" type="file" accept=".json" hidden />
          <button id="deleteBtn" disabled>删除</button>
          <span id="saveStatus"></span>
        </div>
      </header>

      <section class="viewer-grid">
        <section class="viewer-panel original-panel">
          <div class="viewer-head">
            <h3>原文</h3>
            <p id="originalName">PDF</p>
          </div>
          <div id="originalViewer" class="viewer empty">请选择或导入一篇 PDF。</div>
        </section>

        <div class="splitter" data-resize="reader" title="拖动调整原文/译文宽度"></div>

        <section class="viewer-panel translation-panel">
          <div class="viewer-head">
            <h3>译文</h3>
            <p id="translationName">Markdown / TXT</p>
          </div>
          <div id="translationViewer" class="viewer empty">未导入译文。</div>
        </section>

        <div class="splitter" data-resize="notes" title="拖动调整批注宽度"></div>

        <aside class="notes">
          <div class="notes-head">
            <h3>批注</h3>
            <button id="addNoteBtn" disabled>添加</button>
          </div>
          <label>位置</label>
          <input id="noteLocation" placeholder="例如：p.3 / 图 2" />
          <label>内容</label>
          <textarea id="noteText" placeholder="写下批注"></textarea>
          <div id="notesList" class="notes-list"></div>
        </aside>
      </section>
    </main>

    <script src="./app.js" type="module"></script>
  </body>
</html>
